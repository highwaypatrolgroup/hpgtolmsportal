<meta name="theme-color" content="#14295c">
<meta name="description" content="PNP Transportation Office LMS Portal">
<meta property="og:type" content="website">
<meta property="og:title" content="T.O LMS Portal">
<meta property="og:description" content="PNP Transportation Office LMS Portal">
<style>
:root{--bg:#070b1a;--g1:#0f1c4d;--card:rgba(18,28,66,.62);--solid:#111a3d;--tx:#eef2ff;--mu:#9aa6cf;--bd:rgba(150,170,255,.16);--pr:#3b82f6;--pr2:#60a5fa;--gold:#e0b04b;--ok:#34d399;--er:#fb7185}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 20% 10%,#1d3a9a55,transparent),radial-gradient(50% 45% at 85% 90%,#e0b04b22,transparent),var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:#2447c9;top:-80px;left:-60px}
.bg i:nth-child(2){width:300px;height:300px;background:#6d28d9;bottom:-90px;right:-40px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,50px) scale(1.15)}}
.wrap{max-width:1080px;margin:0 auto;padding:18px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}
.glass{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 20px 60px #0007}
.in{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
/* login */
.auth{min-height:100svh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:420px;padding:30px 26px}
.logo{width:116px;height:116px;display:block;margin:0 auto 14px;border-radius:50%;filter:drop-shadow(0 0 22px #e0b04b66);animation:pop 1s ease both,glow 4s ease-in-out infinite alternate}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}}
@keyframes glow{to{filter:drop-shadow(0 0 34px #e0b04b77)}}
h1{font-size:1.35rem;text-align:center;margin:0;letter-spacing:.2px}
.caps{letter-spacing:1.5px;font-size:1.25rem}.lms{color:var(--gold);font-weight:700;letter-spacing:4px;font-size:.85rem}
.sub{text-align:center;color:var(--mu);font-size:.88rem;margin:4px 0 22px}
.fld{position:relative;margin-bottom:14px}
.fld input,.fld select{width:100%;padding:20px 44px 8px 14px;border-radius:12px;border:1px solid var(--bd);background:#0a1230aa;color:var(--tx);font-size:1rem;outline:none;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--pr2);box-shadow:0 0 0 4px #3b82f633}
.fld label{position:absolute;left:14px;top:16px;color:var(--mu);font-size:.95rem;pointer-events:none;transition:.18s;transform-origin:left}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld select+label{top:6px;font-size:.72rem;color:var(--pr2)}
.eye{position:absolute;right:6px;top:8px;background:none;border:0;color:var(--mu);padding:8px;cursor:pointer;font-size:1rem}
.btn{border:0;cursor:pointer;font-size:.97rem;font-weight:600;padding:13px 16px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6 55%,#6366f1);box-shadow:0 8px 22px #2563eb55;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px #2563eb77}.btn:active{transform:none}
.btn.full{width:100%}.btn.ghost{background:#ffffff0d;box-shadow:none;border:1px solid var(--bd);color:var(--tx)}
.btn.red{background:linear-gradient(135deg,#e11d48,#fb7185);box-shadow:none}.btn.sm{padding:7px 11px;font-size:.8rem;border-radius:9px}
.btn[disabled]{opacity:.6;pointer-events:none}
.sw{text-align:center;margin-top:18px;color:var(--mu);font-size:.9rem}
.sw a{color:var(--gold);cursor:pointer;font-weight:600}
.err{color:var(--er);font-size:.85rem;min-height:1.1em;margin:2px 0 10px;text-align:center}
.hint{font-size:.76rem;color:var(--mu);text-align:center;margin-top:16px;opacity:.8}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px}
.bar img{width:46px;height:46px;border-radius:50%}
.bar b{display:block;font-size:1rem}.bar small{color:var(--mu)}.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px}.stat b{font-size:1.8rem;display:block;background:linear-gradient(135deg,#fff,var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mu);font-size:.8rem}
.tabs{display:flex;gap:6px;padding:6px;margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--mu);padding:9px 16px;border-radius:14px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,#2563eb,#6366f1);color:#fff}
.panel{padding:18px}

/* opening splash */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:0;text-align:center;background:radial-gradient(60% 50% at 50% 42%,#1d3a9a55,transparent),radial-gradient(50% 40% at 80% 95%,#e0b04b1c,transparent),#050816;cursor:pointer;transition:opacity .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1),filter .7s;overflow:hidden}
#splash.out{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none}
#splash .sp-logo{position:relative;width:132px;height:132px;display:grid;place-items:center}
#splash img{width:132px;height:132px;border-radius:50%;position:relative;z-index:2;animation:spReveal .85s cubic-bezier(.2,.8,.2,1) 1.45s both}
#splash .sp-logo::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;z-index:1;pointer-events:none;background:radial-gradient(circle,#f3c96955 0,#e0b04b33 24%,#e0b04b1a 42%,#3b82f60f 58%,transparent 72%);opacity:0;animation:spHaloIn 1s cubic-bezier(.2,.8,.2,1) 1.45s forwards,spHalo 3s ease-in-out 2.45s infinite alternate}
#splash .sp-sig{position:absolute;z-index:3;width:46px;padding:9px 0;border-radius:24px;display:grid;justify-items:center;gap:9px;background:#0b1233;border:1px solid #ffffff22;box-shadow:0 10px 40px #0008,inset 0 1px 0 #ffffff14;animation:spPillIn .4s cubic-bezier(.2,.8,.2,1) .05s both,spPillOut .4s ease 1.5s forwards}
#splash .sp-sig i{width:26px;height:26px;border-radius:50%;background:#ffffff12;animation-duration:1.4s;animation-delay:.2s;animation-fill-mode:both;animation-timing-function:linear}
#splash .sp-sig .r{animation-name:spR}#splash .sp-sig .a{animation-name:spA}#splash .sp-sig .g{animation-name:spG}
#splash .sp-scan{position:absolute;left:0;right:0;top:-140px;height:140px;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent,#3b82f622 70%,#9cc8ff66 98%,#ffffffaa);animation:spScan 1.1s cubic-bezier(.5,0,.3,1) 1.45s both}
#splash .sp-lane{position:absolute;left:0;right:0;bottom:13%;height:2px;background:repeating-linear-gradient(90deg,#e0b04b 0 26px,transparent 26px 52px);opacity:.75;animation:spLaneIn 1s cubic-bezier(.3,.7,.2,1) .1s both,spDash 1.1s linear infinite}
#splash .sp-lane::before,#splash .sp-lane::after{content:"";position:absolute;left:0;right:0;height:1px;background:#ffffff1f}
#splash .sp-lane::before{top:-24px}#splash .sp-lane::after{top:26px}
#splash h2{margin:30px 0 0;font-size:clamp(.95rem,4.6vw,1.25rem);font-weight:700;letter-spacing:.22em;padding-left:.22em;color:var(--tx);position:relative;z-index:2}
#splash h2 .w{display:inline-block;white-space:nowrap}
#splash h2 .l{display:inline-block;animation:spLet .6s cubic-bezier(.2,.8,.2,1) calc(1.75s + var(--i)*26ms) both}
#splash p{margin:8px 0 0;color:var(--gold);font-weight:700;letter-spacing:.5em;font-size:.8rem;position:relative;z-index:2;animation:spSub .9s cubic-bezier(.2,.8,.2,1) 2.3s both}
body.splashing #app{opacity:0;transform:translateY(16px) scale(.985)}
#app{transition:opacity .7s ease .1s,transform .7s cubic-bezier(.2,.8,.2,1) .1s}
@keyframes spReveal{from{clip-path:inset(100% 0 0 0);transform:scale(1.18) translateY(10px)}to{clip-path:inset(0 0 0 0)}}
@keyframes spHaloIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes spHalo{from{opacity:.6;transform:scale(.95)}to{opacity:.85;transform:scale(1.04)}}
@keyframes spPillIn{from{opacity:0;transform:scale(.8) translateY(8px)}}
@keyframes spPillOut{to{opacity:0;transform:scale(.7);filter:blur(6px)}}
@keyframes spR{0%,12%{background:#ffffff12;box-shadow:none}14%,48%{background:#ff4d5a;box-shadow:0 0 18px #ff4d5acc}52%,100%{background:#ffffff12;box-shadow:none}}
@keyframes spA{0%,46%{background:#ffffff12;box-shadow:none}50%,78%{background:#ffb84a;box-shadow:0 0 18px #ffb84acc}82%,100%{background:#ffffff12;box-shadow:none}}
@keyframes spG{0%,76%{background:#ffffff12;box-shadow:none}80%,100%{background:#3ddc84;box-shadow:0 0 22px #3ddc84cc}}
@keyframes spScan{from{transform:translateY(0)}to{transform:translateY(calc(100vh + 140px))}}
@keyframes spLaneIn{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
@keyframes spDash{to{background-position-x:-52px}}
@keyframes spLet{from{opacity:0;transform:translateY(.8em);filter:blur(4px)}}
@keyframes spSub{from{opacity:0;transform:translateY(8px);letter-spacing:.9em;filter:blur(4px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

.gb2{position:absolute;inset:0;background:repeating-radial-gradient(circle at 18% 85%,#ffffff0d 0 .25cqw,transparent .25cqw 1cqw),repeating-linear-gradient(45deg,#ffffff06 0 .3cqw,transparent .3cqw 1.4cqw)}
.th{position:absolute;top:13cqw;bottom:0;left:32.8cqw;width:.5cqw;background:repeating-linear-gradient(180deg,#e0b04b88 0 1.2cqw,transparent 1.2cqw 1.8cqw)}
.gh{position:absolute;right:5cqw;bottom:8cqw;width:12cqw;height:15cqw;border-radius:1cqw;overflow:hidden;opacity:.18}.gh img{width:100%;height:100%;object-fit:cover;display:block}
.sc{position:absolute;left:4cqw;bottom:3.2cqw;font-size:max(5px,1.5cqw);letter-spacing:.25cqw;color:#c7d2fe}.sc b{margin-left:1.4cqw;font-family:ui-monospace,Menlo,monospace;color:#fde68a;font-size:max(6px,1.9cqw)}
.mt{position:absolute;left:4cqw;right:4cqw;bottom:1.2cqw;font-size:max(3px,.85cqw);color:#ffffff59;letter-spacing:.12cqw;white-space:nowrap;overflow:hidden}
.hl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 38%,#78c8ff2e 44%,#ff96e633 50%,#ffe67833 56%,transparent 62%);background-size:260% 100%;animation:shim 6s ease-in-out infinite}
@keyframes shim{0%{background-position:140% 0}100%{background-position:-60% 0}}
.pick{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:250px;overflow:auto}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);cursor:pointer;font-size:.92rem}.pk:hover{background:#ffffff0a}.pk.on{border-color:var(--pr2);background:#3b82f622}
.hint{text-align:center;color:var(--mu);font-size:.78rem;margin:0 0 14px}
.mlogo{display:none}
@media(max-width:820px){.shell{display:block}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:6;border-right:0;border-top:1px solid var(--bd);background:#0a1130f5}
.brand,.who{display:none}.nav{flex-direction:row;width:100%;gap:2px}.nav button{flex:1;flex-direction:column;gap:3px;justify-content:center;font-size:.6rem;padding:7px 2px;text-align:center;box-shadow:none!important;min-width:0}.nav button.on{background:#2563eb33}
main{padding:14px 14px 96px}.head h2{font-size:1.2rem}.mlogo{display:block;width:36px;height:36px;border-radius:50%;margin-right:10px}.head>div:first-child{display:flex;align-items:center}.head small{display:block}
#toast{bottom:88px}.ecard{padding:14px;gap:12px}.ph{width:84px;height:106px}.ei h3{font-size:1.05rem}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:12px;gap:10px}.kpi i{width:36px;height:36px}.kpi b{font-size:1.35rem}.card{padding:14px}.grid{grid-template-columns:1fr}
.tools .fld{min-width:100%}.tools .btn{flex:1}}
@media(max-width:700px){.rt thead{display:none}.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}.rt tr{border:1px solid var(--bd);border-radius:12px;padding:6px 12px;margin-bottom:10px;background:#ffffff06!important}
.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 0;white-space:normal;text-align:right}.rt td:before{content:attr(data-label);color:var(--mu);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;text-align:left;flex:none}
.rt td:last-child{justify-content:flex-end;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin-top:4px;padding-top:10px}.rt td:last-child:before{display:none}.wrap{padding:12px}}
.sbox{width:170px;height:70px;border-radius:10px;border:1px dashed var(--bd);background:#fff;display:grid;place-items:center;font-size:.7rem;color:#64748b;overflow:hidden;flex:none}.sbox img{max-width:94%;max-height:90%;object-fit:contain}
.dprev{background:linear-gradient(135deg,#f7f9fd,#dde4f2);color:#0f1c4d;border-radius:12px;padding:14px;text-align:center;max-width:300px;margin-bottom:16px}.dprev .s{height:60px;display:flex;align-items:flex-end;justify-content:center}.dprev img{max-height:100%;max-width:100%}.dprev .n{border-top:1px solid #0f1c4d66;margin-top:4px;padding-top:6px;font-weight:700}.dprev small{color:#3b4a7a}

.pwel{margin:6px 0 0;text-align:center;line-height:1.05;overflow-wrap:anywhere}.pwel span{display:block;font-size:.8rem;font-weight:600;letter-spacing:.5em;padding-left:.5em;color:#cfdcff}
.pwel b{display:block;margin-top:8px;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:clamp(1.9rem,9vw,2.8rem);font-weight:700;letter-spacing:.02em;background:linear-gradient(180deg,#fff 15%,var(--g1) 60%,var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px #0008)}

.pstats{width:100%;display:grid;grid-template-columns:.9fr 1.45fr 1.15fr;border:1px solid #ffffff22;border-radius:18px;background:#ffffff0d;margin-bottom:14px;overflow:hidden}
.pstats>div{padding:12px 8px;text-align:center;min-width:0}.pstats>div+div{border-left:1px solid #ffffff1c}.pstats small{display:block;font-size:.58rem;letter-spacing:1.6px;color:#9fb4ee;margin-bottom:5px}.pstats b{font-size:.8rem;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pstats .mono{font-family:ui-monospace,Menlo,monospace;color:var(--g1);letter-spacing:.5px}

.pico{display:grid;place-items:center;border-radius:20px;color:var(--g1);background:linear-gradient(145deg,#ffffff1f,#ffffff08);border:1px solid #f6d77a55;box-shadow:inset 0 1px 0 #ffffff33,0 8px 20px #0005}
